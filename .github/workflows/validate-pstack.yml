name: Validate pstack

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save fast-check@4.5.3
      - name: Check Codex files
        run: node scripts/build-codex.mjs --check
      - name: Check pstack docs
        run: node scripts/check-pstack-docs.mjs
      - name: Test pstack skill scripts
        run: node --disable-warning=ExperimentalWarning --test skills/*/scripts/test/*.test.ts
